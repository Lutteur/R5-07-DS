name: Contenu XYZ.txt copier dans Q1_archive_XYZ.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copier-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Copier XYZ.txt vers Q1_archive_XYZ.txt
        run: cp XYZ.txt Q1_archive_XYZ.txt

      - name: Commiter et pousser le fichier créé
        run: |
          git config --global user.email pauln8069@gmail.com
          git config --global user.name Lutteur
          git add Q1_archive_XYZ.txt
          git commit -m "Création de Q1_archive_XYZ.txt" || exit 0
          git push
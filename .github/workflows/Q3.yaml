name: Création du fichier Q3_archive_XYZ.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copier-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ecrire information dans Q3_archive_XYZ.txt
        run: |
          echo "Nom/Prénom : Noël Paul" > Q3_archive_XYZ.txt
          echo "" >> Q3_archive_XYZ.txt
          cat Q3.java >> Q3_archive_XYZ.txt

      - name: Commiter et pousser le fichier créé
        run: |
          git config --global user.email pauln8069@gmail.com
          git config --global user.name Lutteur
          git add Q3_archive_XYZ.txt
          git commit -m "Création de Q3_archive_XYZ.txt" || exit 0
          git push
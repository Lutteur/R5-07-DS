name: Création du fichier Q2_archive_XYZ.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copier-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ecrire information dans Q2_archive_XYZ.txt
        run: |
          echo "Nom/Prénom : Noël Paul" > Q2_archive_XYZ.txt
          echo "Date : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "Taille : $(stat -c%s XYZ.txt) octets" >> Q2_archive_XYZ.txt

      - name: Commiter et pousser le fichier créé
        run: |
          git config --global user.email pauln8069@gmail.com
          git config --global user.name Lutteur
          git add Q2_archive_XYZ.txt
          git commit -m "Création de Q2_archive_XYZ.txt" || exit 0
          git push
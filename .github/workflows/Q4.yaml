name: Création du fichier Q4_archive_date.txt

on:
  push:
    paths-ignore:
      - 'Q4_archive_*.txt'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copier-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ecrire information dans Q4_archive_XYZ.txt
        run: |
          DATE_JOUR=$(TZ='Europe/Paris' date +'%d-%m-%Y')
          NOM_FICHIER="Q4_archive_${DATE_JOUR}.txt"
          
          echo "Nom/Prénom : Noël Paul" > "$NOM_FICHIER"
          echo "" >> "$NOM_FICHIER"
          cat Q4.java >> "$NOM_FICHIER"

      - name: Commiter et pousser le fichier créé
        run: |
          git config --global user.email pauln8069@gmail.com
          git config --global user.name Lutteur
          git add Q4_archive_*.txt
          git commit -m "Création de Q4_archive_date.txt" || exit 0
          git push
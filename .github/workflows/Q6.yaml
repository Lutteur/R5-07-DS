name: Création de Q6_archive_date.txt et Q6_différences.txt

on:
  push:
    paths-ignore:
      - 'Q6_archive_*.txt'

    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copier-et-pousser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ecrire information dans Q6_archive_XYZ.txt
        run: |
          DATE_JOUR=$(TZ='Europe/Paris' date +'%d-%m-%Y')
          NOM_FICHIER="Q6_archive_${DATE_JOUR}.txt"
          
          echo "Nom/Prénom : Noël Paul" > "$NOM_FICHIER"
          echo "" >> "$NOM_FICHIER"
          cat Q6.java >> "$NOM_FICHIER"
          echo "Taille $(wc Q6.java)" >> "$NOM_FICHIER"

      - name : Ecrire diff entre les deux Q6_archive_XYZ.txt
        run : |
          echo "Difference : $(git diff Q6_archive_XYZ.txt Q6_archive_XYZ.txt)" >> Q6_différences.txt

      - name: Commiter et pousser le fichier créé
        run: |
          git config --global user.email pauln8069@gmail.com
          git config --global user.name Lutteur
          git add Q6_archive_*.txt Q6_différences.txt
          git commit -m "Création de Q6_archive_date.txt et Q6_différences.txt" || exit 0
          git push